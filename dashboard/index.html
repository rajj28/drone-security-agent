<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Security Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2.5rem;
        }
        .status-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .online { background: #4ade80; box-shadow: 0 0 10px #4ade80; }
        .offline { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
        .button {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            margin: 5px;
        }
        .button:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        .response {
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .endpoint {
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 1rem;
            margin: 10px 0;
        }
        code {
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚁 Drone Security Dashboard</h1>
        
        <div class="status-card">
            <h2>API Status</h2>
            <p>
                <span id="status-dot" class="status-indicator offline"></span>
                <span id="status-text">Checking...</span>
            </p>
            <button class="button" onclick="checkHealth()">🔄 Check Health</button>
            <div id="health-response" class="response" style="display:none"></div>
        </div>

        <div class="status-card">
            <h2>Quick Actions</h2>
            <button class="button" onclick="listFrames()">📁 List Frames</button>
            <button class="button" onclick="listSessions()">📂 List Sessions</button>
            <button class="button" onclick="askAgent()">🤖 Ask Agent</button>
            <div id="action-response" class="response" style="display:none"></div>
        </div>

        <div class="status-card">
            <h2>API Endpoints</h2>
            <div class="endpoint">
                <strong>Health:</strong> <code id="api-health">...</code>
            </div>
            <div class="endpoint">
                <strong>Frames:</strong> <code id="api-frames">...</code>
            </div>
            <div class="endpoint">
                <strong>Sessions:</strong> <code id="api-sessions">...</code>
            </div>
        </div>
    </div>

    <script>
        // API URL - will be replaced by Vercel env var
        const API_URL = 'https://drone-security-api-27774218566.us-central1.run.app';
        
        document.getElementById('api-health').textContent = `${API_URL}/health`;
        document.getElementById('api-frames').textContent = `${API_URL}/frames`;
        document.getElementById('api-sessions').textContent = `${API_URL}/sessions`;

        async function checkHealth() {
            const responseDiv = document.getElementById('health-response');
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            
            responseDiv.style.display = 'block';
            responseDiv.textContent = 'Loading...';
            
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                
                responseDiv.textContent = JSON.stringify(data, null, 2);
                statusDot.className = 'status-indicator online';
                statusText.textContent = `Online - ${data.status}`;
            } catch (error) {
                responseDiv.textContent = `Error: ${error.message}`;
                statusDot.className = 'status-indicator offline';
                statusText.textContent = 'Offline';
            }
        }

        async function listFrames() {
            const responseDiv = document.getElementById('action-response');
            responseDiv.style.display = 'block';
            responseDiv.textContent = 'Loading frames...';
            
            try {
                const response = await fetch(`${API_URL}/frames`);
                const data = await response.json();
                responseDiv.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                responseDiv.textContent = `Error: ${error.message}`;
            }
        }

        async function listSessions() {
            const responseDiv = document.getElementById('action-response');
            responseDiv.style.display = 'block';
            responseDiv.textContent = 'Loading sessions...';
            
            try {
                const response = await fetch(`${API_URL}/sessions`);
                const data = await response.json();
                responseDiv.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                responseDiv.textContent = `Error: ${error.message}`;
            }
        }

        async function askAgent() {
            const question = prompt('Enter your question for the agent:');
            if (!question) return;
            
            const responseDiv = document.getElementById('action-response');
            responseDiv.style.display = 'block';
            responseDiv.textContent = 'Asking agent...';
            
            try {
                const response = await fetch(`${API_URL}/ask`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        question: question,
                        session_id: 'default'
                    })
                });
                const data = await response.json();
                responseDiv.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                responseDiv.textContent = `Error: ${error.message}`;
            }
        }

        // Auto-check health on load
        checkHealth();
    </script>
</body>
</html>
