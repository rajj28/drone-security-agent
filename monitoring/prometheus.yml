global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Security Video Analysis System
  - job_name: 'security-video-processor'
    static_configs:
      - targets: ['video_processor:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # API Gateway
  - job_name: 'security-api-gateway'
    static_configs:
      - targets: ['api_gateway:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Alert Manager
  - job_name: 'security-alert-manager'
    static_configs:
      - targets: ['alert_manager:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:9187']

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']

  # Node Exporter (system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
