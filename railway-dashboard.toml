# Dashboard Service Configuration (hearty-heart)
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.dashboard"

[deploy]
startCommand = "streamlit run demo/dashboard.py --server.port=${PORT} --server.address=0.0.0.0 --server.headless=true --server.enableCORS=false --server.enableXsrfProtection=false"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
