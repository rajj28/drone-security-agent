# Dashboard Service Configuration (hearty-heart)
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.dashboard"

[deploy]
# No startCommand - Dockerfile.dashboard's shell-form CMD handles port binding
# CMD streamlit run demo/dashboard.py --server.port=${PORT:-8501} --server.address=0.0.0.0 --server.headless=true --server.enableCORS=false --server.enableXsrfProtection=false
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
