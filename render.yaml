services:
  - type: web
    name: drone-security-api
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: |
      echo "🔧 API Service Build Starting..."
      pip install --upgrade pip
      pip install -r requirements.txt
      echo "✅ API dependencies installed"
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT --workers 1 --log-level info --timeout-keep-alive 75
    healthCheckPath: /health  # Matches FastAPI endpoint
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: OPENAI_API_KEY
        sync: false  # Set in Render dashboard
      - key: PINECONE_API_KEY
        sync: false
      - key: USE_CLOUD_ANALYZER
        value: "true"
      - key: MAX_FRAMES
        value: 10  # Reduced for free tier memory limits
      - key: API_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: drone-security-dashboard
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: |
      echo "📊 Dashboard Service Build Starting..."
      pip install --upgrade pip
      pip install -r requirements.txt
      echo "✅ Dashboard dependencies installed"
    startCommand: streamlit run demo/dashboard.py --server.port $PORT --server.headless true --server.enableCORS false
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: API_URL
        value: https://drone-security-api.onrender.com
      - key: OPENAI_API_KEY
        sync: false  # CRITICAL: Add in Render dashboard!
      - key: PINECONE_API_KEY
        sync: false
      - key: LANGCHAIN_API_KEY
        sync: false  # CRITICAL: Add in Render dashboard!
      - key: USE_CLOUD_ANALYZER
        value: "true"
      - key: DASHBOARD_ENV
        value: production
